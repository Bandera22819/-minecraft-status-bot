name: Minecraft server status

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send status
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 monitor.py
